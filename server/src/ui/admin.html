<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Control Hub · PC</title>
  <style>
    :root {
      --bg: #0b1020; --panel: #121a30; --panel2: #182240; --border: #243156;
      --text: #e8edf7; --muted: #8b97b8; --accent: #4f7cff; --ok: #2ecc71;
      --err: #e74c3c; --warn: #f1c40f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 14px; padding: 16px 22px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; }
    .pill { padding: 4px 12px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
    .pill.ok { color: var(--ok); border-color: var(--ok); }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
    main { display: grid; grid-template-columns: 380px 1fr; gap: 18px; padding: 22px; max-width: 1100px; margin: 0 auto; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .qr { width: 100%; border-radius: 10px; background: #fff; padding: 8px; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--accent); word-break: break-all; }
    .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
    .btn { border: 1px solid var(--border); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #7c5cff); border: none; }
    .btn.danger { background: #3a1620; border-color: #7a2530; color: #ff9a9a; }
    .btn:hover { filter: brightness(1.15); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .switch { cursor: pointer; user-select: none; font-size: 13px; }
    .switch input { margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .badge.on { background: rgba(46,204,113,.15); color: var(--ok); }
    .badge.off { background: rgba(139,151,184,.12); color: var(--muted); }
    .pending { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .code { font-size: 22px; letter-spacing: 8px; font-weight: 700; background: var(--panel2); border: 1px dashed var(--border); border-radius: 10px; text-align: center; padding: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 18px 0; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
    .modal.hidden { display: none; }
    .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: 320px; }
    .input { width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; margin: 10px 0; }
    .muted { color: var(--muted); }
    .flex { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>🖥 Remote Control Hub</h1>
    <span id="pill" class="pill warn">cargando…</span>
    <span id="modeChip" class="pill"></span>
    <span class="muted" id="uptime"></span>
    <span style="flex:1"></span>
    <button class="btn danger" id="btnStop">Detener servidor</button>
  </header>

  <main>
    <section>
      <div class="card">
        <h2>Conectar el celular</h2>
        <img id="qr" class="qr" alt="QR" />
        <div class="mono" id="urlText"></div>
        <div class="row muted" id="ipText"></div>
      </div>
      <div class="card">
        <h2>Emparejamiento</h2>
        <div id="pairingBox"><div class="empty">Sin solicitudes pendientes.</div></div>
      </div>
    </section>

    <section>
      <div class="card">
        <h2>Dispositivos</h2>
        <table>
          <thead><tr><th>Dispositivo</th><th>Estado</th><th>Ratón</th><th>Teclado</th><th>Audio</th><th></th></tr></thead>
          <tbody id="devices"></tbody>
        </table>
        <div id="devicesEmpty" class="empty">Todavía no hay dispositivos emparejados.</div>
      </div>

      <div class="card">
        <h2>Micrófono / Audio</h2>
        <div class="row"><span class="muted">Modo:</span> <span id="audioMode"></span></div>
        <div class="row"><span class="muted">Estado:</span> <span id="audioState"></span></div>
        <div class="row"><span class="muted">Recibido:</span> <span id="audioBytes"></span></div>
        <div class="row"><span class="muted">Salida (config RCH_AUDIO_DEVICE):</span> <span id="audioDevices"></span></div>
      </div>
    </section>
  </main>

  <div id="tokenModal" class="modal hidden">
    <div class="modal-card">
      <h2 style="margin:0">Token de administración</h2>
      <input id="tokenInput" class="input" type="password" placeholder="RCH_ADMIN_TOKEN" />
      <button class="btn primary" id="tokenSave" style="width:100%">Guardar</button>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    let adminToken = localStorage.getItem('rch.admin.token') || '';
    if (adminToken) $('tokenModal').classList.add('hidden');

    function headers() {
      return adminToken ? { 'x-admin-token': adminToken } : {};
    }

    async function api(path, method = 'GET', body = null) {
      const res = await fetch(path, {
        method,
        headers: { ...headers(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401 && !adminToken) {
        $('tokenModal').classList.remove('hidden');
        throw new Error('token requerido');
      }
      if (res.status === 401 && adminToken) {
        localStorage.removeItem('rch.admin.token');
        adminToken = '';
        $('tokenModal').classList.remove('hidden');
        throw new Error('token inválido');
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }
    $('tokenSave').addEventListener('click', async () => {
      adminToken = $('tokenInput').value.trim();
      localStorage.setItem('rch.admin.token', adminToken);
      $('tokenModal').classList.add('hidden');
      refresh();
    });

    function fmtBytes(n) {
      if (n == null) return '-';
      if (n > 1 << 20) return (n / (1 << 20)).toFixed(1) + ' MB';
      if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
      return n + ' B';
    }

    function renderPairing(st) {
      const box = $('pairingBox');
      if (!st.pending.length) {
        box.innerHTML = '<div class="empty">Sin solicitudes pendientes.</div>';
        return;
      }
      box.innerHTML = '';
      for (const p of st.pending) {
        const el = document.createElement('div');
        el.className = 'pending';
        el.innerHTML = `
          <div style="flex:1">
            <div><b>${p.name}</b> quiere conectarse</div>
            <div class="muted" style="font-size:12px">${p.deviceId.slice(0, 12)}…</div>
          </div>
          <span class="code">${p.code}</span>
          <div class="flex">
            <button class="btn primary" data-approve="${p.id}">Aprobar</button>
            <button class="btn danger" data-reject="${p.id}">Rechazar</button>
          </div>`;
        box.appendChild(el);
      }
      for (const b of box.querySelectorAll('[data-approve]')) {
        b.addEventListener('click', async () => {
          await api('/api/pair/approve', 'POST', { pairingId: b.dataset.approve });
          refresh();
        });
      }
      for (const b of box.querySelectorAll('[data-reject]')) {
        b.addEventListener('click', async () => {
          await api('/api/pair/reject', 'POST', { pairingId: b.dataset.reject });
          refresh();
        });
      }
    }

    function renderDevices(st) {
      const tbody = $('devices');
      tbody.innerHTML = '';
      $('devicesEmpty').style.display = st.devices.length ? 'none' : '';
      for (const d of st.devices) {
        const tr = document.createElement('tr');
        const perms = (name, label) => `
          <label class="switch">
            <input type="checkbox" data-perm="${name}" data-id="${d.id}" ${d.perms[name] ? 'checked' : ''} /> ${label}
          </label>`;
        tr.innerHTML = `
          <td><b>${d.name}</b><div class="muted" style="font-size:11px">${d.id.slice(0, 12)}…</div></td>
          <td><span class="badge ${d.connected ? 'on' : 'off'}">${d.connected ? 'conectado' : 'desconectado'}</span></td>
          <td>${perms('mouse', 'Ratón')}</td>
          <td>${perms('keyboard', 'Teclado')}</td>
          <td>${perms('audio', 'Audio')}</td>
          <td><button class="btn danger" data-revoke="${d.id}">Revocar</button></td>`;
        tbody.appendChild(tr);
      }
      for (const t of tbody.querySelectorAll('[data-perm]')) {
        t.addEventListener('change', async () => {
          await api(`/api/devices/${t.dataset.id}/toggle`, 'POST', {
            perm: t.dataset.perm,
            enabled: t.checked,
          });
        });
      }
      for (const b of tbody.querySelectorAll('[data-revoke]')) {
        b.addEventListener('click', async () => {
          if (!confirm('¿Revocar este dispositivo?')) return;
          await api(`/api/devices/${b.dataset.revoke}/revoke`, 'POST', {});
          refresh();
        });
      }
    }

    function renderAudio(st) {
      const a = st.audio;
      $('audioMode').textContent = a.mode === 'capture' ? 'CAPTURA (archivo)' : 'REPRODUCCIÓN';
      $('audioState').textContent = a.active ? 'activo' : 'inactivo';
      $('audioBytes').textContent = fmtBytes(a.delivered) + ' entregados · ' + fmtBytes(a.dropped) + ' descartados';
      $('audioDevices').textContent = a.devices || 'sin info';
    }

    async function refresh() {
      try {
        const st = await api('/api/status');
        $('pill').textContent = 'servidor activo';
        $('pill').className = 'pill ok';
        const modes = [];
        if (st.mode.input === 'dry') modes.push('input PRUEBA (dry-run)');
        if (st.mode.audio === 'capture') modes.push('audio CAPTURA');
        $('modeChip').textContent = modes.join(' · ') || 'modo real';
        $('modeChip').className = 'pill ' + (modes.length ? 'warn' : 'ok');
        $('uptime').textContent = 'activo ' + (Math.round(st.uptime / 1000 / 60)) + ' min';

        $('urlText').textContent = st.host.split('//')[1] + '/app';
        $('ipText').textContent = (st.ips || []).join('  ·  ');
        if (!$('qr').src || $('qr').dataset.u !== st.host) {
          const q = await api('/api/qr');
          $('qr').src = q.dataUrl;
          $('qr').dataset.u = st.host;
        }

        renderPairing(st);
        renderDevices(st);
        renderAudio(st);
      } catch (e) {
        $('pill').textContent = 'sin conexión';
        $('pill').className = 'pill warn';
      }
    }

    $('btnStop').addEventListener('click', async () => {
      if (!confirm('¿Detener el servidor?')) return;
      await api('/api/server/stop', 'POST', {});
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
